<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kart Tuner">
<meta name="theme-color" content="#0f0f0f">
<title>Kart Tuner</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: rgba(255,255,255,0.09);
    --text: #f0f0f0;
    --muted: #888;
    --accent: #e8452a;
    --accent2: #f0a500;
    --blue: #3a8fe8;
    --green: #3aaa60;
    --radius: 16px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, 'SF Pro Text', sans-serif; overscroll-behavior: none; }
  #app { max-width: 430px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  header { padding: calc(var(--safe-top) + 18px) 20px 14px; background: var(--bg); border-bottom: 0.5px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .header-inner { display: flex; align-items: center; gap: 10px; }
  .back-btn { background: var(--surface); border: none; color: var(--accent); font-size: 15px; font-family: -apple-system, sans-serif; padding: 6px 12px; border-radius: 20px; cursor: pointer; display: none; align-items: center; gap: 4px; flex-shrink: 0; }
  .back-btn.visible { display: flex; }
  .header-title { font-size: 17px; font-weight: 600; color: var(--text); flex: 1; }
  .progress-bar { display: flex; gap: 5px; margin-top: 10px; }
  .pip { height: 3px; flex: 1; background: var(--surface2); border-radius: 4px; transition: background 0.3s; }
  .pip.on { background: var(--accent); }

  main { flex: 1; padding: 20px 16px calc(var(--safe-bot) + 24px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .screen { display: none; animation: fadeUp 0.22s ease; }
  .screen.active { display: block; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .hero-label { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  h2 { font-size: 26px; font-weight: 700; line-height: 1.2; color: var(--text); margin-bottom: 8px; }
  .subtitle { font-size: 15px; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }

  .btn-list { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px 18px; text-align: left; cursor: pointer; width: 100%; transition: background 0.15s, transform 0.1s; display: flex; align-items: center; gap: 14px; }
  .choice-btn:active { background: var(--surface2); transform: scale(0.98); }
  .choice-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .icon-red { background: rgba(232,69,42,0.15); }
  .icon-blue { background: rgba(58,143,232,0.15); }
  .icon-amber { background: rgba(240,165,0,0.15); }
  .icon-gray { background: rgba(255,255,255,0.07); }
  .choice-text { flex: 1; }
  .choice-label { font-size: 16px; font-weight: 600; color: var(--text); display: block; margin-bottom: 2px; }
  .choice-desc { font-size: 13px; color: var(--muted); display: block; line-height: 1.4; }
  .chevron { color: var(--muted); font-size: 18px; opacity: 0.5; }

  .result-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 12px; }
  .badge-push { background: rgba(232,69,42,0.15); color: #f07060; }
  .badge-loose { background: rgba(58,143,232,0.15); color: #70aaee; }
  .badge-other { background: rgba(255,255,255,0.07); color: var(--muted); }

  .result-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .result-desc { font-size: 14px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }

  .section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; padding-left: 4px; }

  .fix-group { background: var(--surface); border-radius: var(--radius); overflow: hidden; margin-bottom: 10px; border: 0.5px solid var(--border); }
  .fix-group-header { padding: 10px 16px; background: var(--surface2); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border-bottom: 0.5px solid var(--border); }
  .fix-item { display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px; border-bottom: 0.5px solid var(--border); font-size: 15px; color: var(--text); line-height: 1.45; }
  .fix-item:last-child { border-bottom: none; }
  .fix-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 7px; }
  .dot-red { background: var(--accent); }
  .dot-blue { background: var(--blue); }
  .dot-amber { background: var(--accent2); }
  .dot-green { background: var(--green); }

  .tip-box { background: rgba(232,69,42,0.07); border: 0.5px solid rgba(232,69,42,0.2); border-radius: var(--radius); padding: 14px 16px; margin-top: 6px; font-size: 13px; color: #c08070; line-height: 1.6; }
  .tip-box strong { color: #f07060; font-weight: 600; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-inner">
      <button class="back-btn" id="backBtn" onclick="back()">‹ Back</button>
      <span class="header-title" id="headerTitle">🏁 Kart Tuner</span>
    </div>
    <div class="progress-bar">
      <div class="pip on" id="p0"></div>
      <div class="pip" id="p1"></div>
      <div class="pip" id="p2"></div>
    </div>
  </header>

  <main>
    <div class="screen active" id="s0">
      <p class="hero-label">Step 1 of 3</p>
      <h2>Where's the problem?</h2>
      <p class="subtitle">Pick the part of the corner where your kart feels off.</p>
      <div class="btn-list">
        <button class="choice-btn" onclick="go('corner_entry')">
          <div class="choice-icon icon-red">↩</div>
          <div class="choice-text"><span class="choice-label">Entering the corner</span><span class="choice-desc">Turning in, before the apex</span></div>
          <span class="chevron">›</span>
        </button>
        <button class="choice-btn" onclick="go('corner_center')">
          <div class="choice-icon icon-amber">⊙</div>
          <div class="choice-text"><span class="choice-label">Middle of corner</span><span class="choice-desc">At the apex or through the center</span></div>
          <span class="chevron">›</span>
        </button>
        <button class="choice-btn" onclick="go('corner_exit')">
          <div class="choice-icon icon-blue">↪</div>
          <div class="choice-text"><span class="choice-label">Leaving the corner</span><span class="choice-desc">On exit, opening the wheel</span></div>
          <span class="chevron">›</span>
        </button>
        <button class="choice-btn" onclick="go('straight')">
          <div class="choice-icon icon-gray">⇒</div>
          <div class="choice-text"><span class="choice-label">On the straight</span><span class="choice-desc">Speed or acceleration issues</span></div>
          <span class="chevron">›</span>
        </button>
        <button class="choice-btn" onclick="go('general')">
          <div class="choice-icon icon-gray">≡</div>
          <div class="choice-text"><span class="choice-label">General / whole lap</span><span class="choice-desc">Overall balance or handling</span></div>
          <span class="chevron">›</span>
        </button>
      </div>
    </div>

    <div class="screen" id="s1">
      <p class="hero-label">Step 2 of 3</p>
      <h2 id="s1Title">What is it doing?</h2>
      <p class="subtitle">Pick the behavior that matches what you feel.</p>
      <div class="btn-list" id="s1Btns"></div>
    </div>

    <div class="screen" id="s2">
      <div id="s2Content"></div>
    </div>
  </main>
</div>

let navHistory = [];
let currentSection = null;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelector('main').scrollTo(0, 0);
  updateHeader(id);
}

function updateHeader(id) {
  const steps = ['s0','s1','s2'];
  const idx = steps.indexOf(id);
  document.getElementById('backBtn').classList.toggle('visible', id !== 's0');
  ['p0','p1','p2'].forEach((p, i) => document.getElementById(p).classList.toggle('on', i <= idx));
  document.getElementById('headerTitle').textContent = id === 's0' ? '🏁 Kart Tuner' : id === 's1' ? 'What is it doing?' : 'Your fixes';
}

function go(key) {
  navHistory.push(document.querySelector('.screen.active').id);
  currentSection = key;
  const sec = tuningData[key];
  document.getElementById('s1Title').textContent = sec.title;
  const btns = document.getElementById('s1Btns');
  btns.innerHTML = '';
  const icons = ['↩','↪','⊙','⇒','≡','⚑'];
  const iconCls = ['icon-red','icon-blue','icon-amber','icon-gray','icon-gray','icon-red'];
  sec.conditions.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice-btn';
    b.innerHTML = `<div class="choice-icon ${iconCls[i % iconCls.length]}">${icons[i % icons.length]}</div><div class="choice-text"><span class="choice-label">${c.label}</span><span class="choice-desc">${c.desc}</span></div><span class="chevron">›</span>`;
    b.onclick = () => showResult(i);
    btns.appendChild(b);
  });
  show('s1');
}

function showResult(idx) {
  navHistory.push('s1');
  const c = tuningData[currentSection].conditions[idx];
  let html = `<div class="result-badge ${c.badge}">${c.badgeLabel}</div>`;
  html += `<div class="result-title">${c.label}</div>`;
  html += `<div class="result-desc">${c.desc}</div>`;
  c.sections.forEach(section => {
    html += `<div class="section-label">${section.label}</div>`;
    section.fixes.forEach(group => {
      html += `<div class="fix-group"><div class="fix-group-header">${group.cat}</div>`;
      group.items.forEach(item => {
        html += `<div class="fix-item"><div class="fix-dot ${group.dot}"></div><span>${item}</span></div>`;
      });
      html += `</div>`;
    });
  });
  html += `<div class="tip-box"><strong>Tip:</strong> Change one thing at a time and test. Even small adjustments — ¼ psi of air, ⅛" of stagger — can make a big difference on the stopwatch.</div>`;
  document.getElementById('s2Content').innerHTML = html;
  show('s2');
}

function back() {
  if (navHistory.length) show(navHistory.pop());
}
</script>
</body>
</html>
